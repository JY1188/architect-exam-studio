<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>築考練習室｜建築師考試題庫</title>
  <meta name="description" content="建築師考試六大科目互動練習網站" />
  <style>
    :root{--ink:#18302b;--muted:#687772;--paper:#f7f5ef;--card:#fffdf8;--line:#dfe5dc;--green:#1c6754;--mint:#dceee5;--orange:#e68b47;--shadow:0 18px 45px rgba(25,55,44,.11)}
    *{box-sizing:border-box} body{margin:0;background:var(--paper);color:var(--ink);font-family:ui-sans-serif,system-ui,"Noto Sans TC",sans-serif;line-height:1.6}
    .shell{max-width:1180px;margin:auto;padding:28px 22px 54px}.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:44px}.brand{display:flex;gap:11px;align-items:center;font-weight:800;letter-spacing:.04em}.brand-mark{width:38px;height:38px;border-radius:12px;background:var(--green);color:white;display:grid;place-items:center;font-size:20px}.source{font-size:12px;color:var(--muted);text-decoration:none;border-bottom:1px solid #b8c8c0}
    .hero{display:grid;grid-template-columns:1.04fr .96fr;gap:36px;align-items:center;margin-bottom:40px}.eyebrow{color:var(--orange);font-weight:800;font-size:13px;letter-spacing:.14em;text-transform:uppercase}.hero h1{font-family:Georgia,"Noto Serif TC",serif;font-size:clamp(38px,5vw,68px);line-height:1.08;margin:12px 0 18px;letter-spacing:-.05em}.hero p{font-size:17px;color:var(--muted);max-width:590px;margin:0}.hero-art{background:var(--mint);border-radius:32px;min-height:290px;display:grid;place-items:center;overflow:hidden;box-shadow:var(--shadow)}
    .controls{display:flex;justify-content:space-between;align-items:end;gap:18px;margin:18px 0}.controls h2{margin:0;font-size:24px}.filters{display:flex;gap:10px;flex-wrap:wrap}.filter{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:9px 15px;color:var(--muted);cursor:pointer}.filter.active,.filter:hover{background:var(--green);color:white;border-color:var(--green)}
    .subjects{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:48px}.subject{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;min-height:170px;cursor:pointer;transition:.2s;position:relative;overflow:hidden}.subject:hover{transform:translateY(-3px);box-shadow:var(--shadow)}.subject.selected{border:2px solid var(--green);padding:19px}.subject .num{font-size:12px;color:var(--orange);font-weight:800}.subject h3{font-size:20px;margin:8px 0 4px}.subject p{font-size:13px;color:var(--muted);margin:0 0 16px}.subject .count{font-size:12px;color:var(--green);font-weight:700}.subject .dot{position:absolute;width:72px;height:72px;border-radius:50%;background:var(--mint);right:-18px;bottom:-20px}
    .practice{background:#173b32;color:white;border-radius:28px;padding:30px;display:grid;grid-template-columns:1fr .8fr;gap:30px;box-shadow:var(--shadow)}.practice h2{font-family:Georgia,"Noto Serif TC",serif;font-size:32px;margin:0 0 8px}.practice .meta{color:#b9d7cc;font-size:14px}.question{background:var(--card);color:var(--ink);border-radius:20px;padding:22px;margin-top:22px}.qtop{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:13px}.question h3{font-size:21px;line-height:1.45;margin:15px 0}.options{display:grid;gap:10px}.option{display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;border:1px solid var(--line);background:#fff;padding:12px 14px;border-radius:12px;color:var(--ink);cursor:pointer;font-size:15px}.option:hover{border-color:var(--green);background:#f4faf6}.option.correct{border-color:#329267;background:#e3f4e9}.option.wrong{border-color:#cf6b53;background:#fff0ea}.option b{color:var(--green)}.feedback{display:none;margin-top:16px;padding:14px;border-radius:12px;background:#edf6f0;font-size:14px}.feedback.show{display:block}.actions{display:flex;justify-content:space-between;gap:12px;margin-top:18px}.btn{border:0;border-radius:999px;padding:12px 19px;font-weight:800;cursor:pointer}.btn.primary{background:var(--orange);color:white}.btn.secondary{background:#e5f0ea;color:var(--green)}.btn:disabled{opacity:.45;cursor:not-allowed}.illustration{display:grid;place-items:center;background:#245548;border-radius:20px;min-height:260px}.tip{font-size:14px;color:#c7dfd3;margin-top:18px}
    footer{display:flex;justify-content:space-between;gap:20px;color:var(--muted);font-size:12px;margin-top:24px}.empty{padding:26px;color:var(--muted)}
    @media(max-width:820px){.hero,.practice{grid-template-columns:1fr}.hero-art{min-height:220px}.subjects{grid-template-columns:repeat(2,1fr)}.controls{align-items:start;flex-direction:column}}
    @media(max-width:520px){.shell{padding:20px 14px}.topbar{margin-bottom:28px}.subjects{grid-template-columns:1fr}.hero h1{font-size:45px}.practice{padding:20px;border-radius:22px}footer{flex-direction:column}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar"><div class="brand"><span class="brand-mark">築</span><span>築考練習室</span></div><a class="source" href="https://wwwq.moex.gov.tw/exam/wFrmExamQandASearch.aspx" target="_blank" rel="noreferrer">考選部試題平台 ↗</a></header>
    <section class="hero">
      <div><div class="eyebrow">Architect exam studio</div><h1>把每一題，<br/>練成自己的圖面。</h1><p>選一門科目開始。用圖像理解空間、結構與規範，再用即時回饋把弱點留下來，下一次就不再卡住。</p></div>
      <div class="hero-art"><svg viewBox="0 0 460 270" width="90%" aria-label="建築剖面示意圖"><path d="M56 224V92l174-64 174 64v132" fill="none" stroke="#1c6754" stroke-width="5"/><path d="M80 224V106l150-55 150 55v118M109 224V125l121-43 121 43v99" fill="none" stroke="#5b9a84" stroke-width="3"/><path d="M56 224h348M80 184h300M109 151h242" stroke="#1c6754" stroke-width="4"/><path d="M230 28v196M56 92h348" stroke="#e68b47" stroke-width="3" stroke-dasharray="8 8"/><circle cx="230" cy="82" r="9" fill="#e68b47"/><text x="230" y="256" text-anchor="middle" fill="#1c6754" font-size="15" font-family="sans-serif">space · structure · rule</text></svg></div>
    </section>
    <section class="controls"><div><div class="eyebrow">Choose your route</div><h2>選擇練習科目</h2></div><div class="filters" id="filters"><button class="filter active" data-filter="all">全部</button><button class="filter" data-filter="選擇題">選擇題</button><button class="filter" data-filter="申論題">申論題</button></div></section>
    <section class="subjects" id="subjects"></section>
    <section class="practice" id="practice">
      <div><div class="eyebrow">Practice mode</div><h2 id="practiceTitle">先選一門科目</h2><div class="meta" id="practiceMeta">每次練習會隨機抽取題目，作答後可查看重點解析。</div><div class="question" id="questionBox"><div class="empty">從上方選擇科目，開始今天的 10 分鐘練習。</div></div></div>
      <aside><div class="illustration" id="subjectArt"></div><div class="tip">小提示：先看題幹中的「限制條件」，再回頭檢查尺寸、動線與法規門檻。</div></aside>
    </section>
    <footer><span>題庫介面為本地練習版，可持續擴充題目資料。</span><span>建築師考試六大科目</span></footer>
  </main>
  <script>
    const subjects=[
      {id:'law',title:'營建法規與實務',short:'法規',type:'選擇題',desc:'建築法、都市計畫與執照實務',color:'#e68b47',count:'80 題',format:'80 題測驗題｜2 小時'},
      {id:'structure',title:'建築結構',short:'結構',type:'混合題',desc:'結構系統、力流與耐震觀念',color:'#6b8ed6',count:'2＋40 題',format:'2 題申論＋40 題測驗｜2 小時'},
      {id:'construction',title:'建築構造與施工',short:'構造施工',type:'選擇題',desc:'材料、工法、施工順序與品質',color:'#bf7f55',count:'80 題',format:'80 題測驗題｜2 小時'},
      {id:'environment',title:'建築環境控制',short:'環控',type:'混合題',desc:'採光、通風、熱環境與設備',color:'#55a88a',count:'3＋40 題',format:'3 題申論＋40 題測驗｜2 小時'},
      {id:'site',title:'敷地計畫與都市設計',short:'敷地都市',type:'申論題',desc:'基地分析、都市紋理與公共性',color:'#9970bb',count:'1 題',format:'1 題整合申論｜4 小時'},
      {id:'design',title:'建築計畫與設計',short:'建築設計',type:'申論題',desc:'需求轉譯、空間組織與表達',color:'#d06c80',count:'1 題',format:'1 題設計題｜8 小時'}
    ];
    const questions={
      law:[['依建築法規定，供公眾使用建築物之室內裝修，通常應先辦理何種程序？',['申請審查許可','向鄰戶取得同意','完成使用後再補件','只需承造人簽章'],0,'重點在於供公眾使用建築物的室內裝修審查制度。'],['建築基地與建築線的關係，何者最符合建築法的基本原則？',['基地應與建築線相連接','基地一定要臨接兩條道路','建築線只能由起造人指定','基地深度不得超過寬度'],0,'基地與建築線的連接是申請建築許可的重要基本條件。'],['建築物部分完竣且可供獨立使用時，可能申請何種執照？',['部分使用執照','臨時拆除執照','分區使用證明','室內裝修證明'],0,'部分使用執照的核心前提是已完竣部分能夠獨立使用。']],
      structure:[['在一般結構系統中，樓板荷重最直接的傳遞路徑通常是？',['樓板→梁→柱／牆→基礎','樓板→門窗→地坪','樓板→屋頂→外牆','樓板→裝修→土方'],0,'先辨識重力荷載的主要力流，再檢查構件是否連續。'],['耐震設計中，何者有助於降低結構扭轉不規則造成的風險？',['讓質量與勁度分布更均勻','把所有隔間集中在一側','只增加外牆裝飾重量','取消所有伸縮縫'],0,'平面配置越均衡，質量中心與剛心偏心越容易控制。'],['鋼筋混凝土梁的撓度控制，與下列哪一項最直接相關？',['構件剛度與跨距','油漆顏色','門扇開啟方向','基地綠覆率'],0,'撓度與 EI、跨距及荷載有直接關係。']],
      construction:[['施工圖中標示的「放樣」，主要目的為何？',['將設計位置準確轉移至現場','決定混凝土配比','檢查空調濾網','計算土地增值稅'],0,'放樣是把軸線、界線與標高從圖面落實到現場。'],['混凝土澆置前，最應優先確認哪一項？',['模板、鋼筋與預埋件位置','外牆塗料色票','家具採購單','景觀植栽清單'],0,'澆置後難以修正，因此模板、鋼筋及預埋件須先完成查驗。'],['防水層施工的搭接與收頭，主要是為了？',['避免水路在接縫處形成','增加室內照度','提升結構自重','縮短養護時間'],0,'防水工程最常見的失效點就是接縫、轉角與收頭。']],
      environment:[['建築物配置開口時，若希望增加自然通風，通常應優先考慮？',['形成有效的進、排風路徑','把所有開口設在同一面','完全封閉天井','只增加玻璃厚度'],0,'自然通風需有壓差與連續的空氣路徑，對向或高低開口常有幫助。'],['水平遮陽板對南向開口的主要作用是？',['阻擋高角度夏日直射日光','增加冬季西曬','取代所有空調設備','提高室內噪音'],0,'南向太陽高度角季節差異大，水平遮陽有利於夏季遮陽。'],['採光設計中，窗地比可用來初步描述什麼？',['窗面積與室內地板面積的比例','窗戶重量與牆重比例','照明功率與電費比例','玻璃厚度與樓高比例'],0,'窗地比是自然採光評估的常見初步指標，不等於完整採光計算。']],
      site:[['基地分析開始時，下列哪一組資料最值得先建立？',['日照、風向、出入口與周邊使用','家具品牌與室內色彩','施工人力與工期獎金','住戶姓名與電話'],0,'先掌握基地的環境條件與城市關係，才能形成有依據的配置策略。'],['都市設計中，將一樓公共空間與街道連續起來，通常可提升？',['步行可達性與公共性','地下室防水等級','結構混凝土強度','設備機房效率'],0,'首層界面、騎樓、廣場與人行動線會直接影響街道生活。'],['基地配置圖中保留既有大樹，較可能帶來哪種設計價值？',['微氣候、場所記憶與生態效益','增加電梯速度','降低梁柱尺寸','取消無障礙動線'],0,'保留既有自然元素常同時回應環境與場所認同。']],
      design:[['建築計畫由需求轉成空間時，最重要的第一步通常是？',['整理使用者、行為與相互關係','先選定外牆磁磚','先畫立面裝飾線','先決定家具價格'],0,'好的建築設計從需求與行為關係出發，再轉成空間組織。'],['設計方案比較時，何者最能幫助團隊快速溝通？',['以圖解、動線與量體模型說明','只交一張效果圖','只描述個人喜好','省略基地條件'],0,'多種尺度的圖像表達能把抽象策略轉成可討論的設計決策。'],['公共建築的動線規劃，首先應確保？',['主要使用者能清楚、安全抵達目的地','所有房間都面向同一方向','每條走道都一樣長','服務動線與訪客動線完全重疊'],0,'清楚、可及、安全的動線是公共建築計畫的基本品質。']]
    };
    let current=null, index=0, answered=false, filter='all';
    const $=s=>document.querySelector(s); const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
    function renderSubjects(){ $('#subjects').innerHTML=subjects.filter(s=>filter==='all'||s.type===filter||s.type==='混合題'&&filter==='選擇題').map((s,i)=>`<article class="subject ${current===s.id?'selected':''}" data-id="${s.id}"><div class="dot" style="background:${s.color}22"></div><div class="num">0${i+1} / ${s.type}</div><h3>${s.title}</h3><p>${s.desc}</p><span class="count">正式 ${s.count}｜開始練習 →</span></article>`).join(''); document.querySelectorAll('.subject').forEach(el=>el.onclick=()=>start(el.dataset.id)); }
    function art(s){return `<svg viewBox="0 0 300 210" width="88%" aria-label="${s.title}圖解"><g fill="none" stroke="${s.color}" stroke-width="5"><path d="M35 174h230M54 174V83l96-45 96 45v91M78 174v-72h48v72M174 174v-72h48v72"/><path d="M150 38v136M54 83h192" stroke-dasharray="7 7"/></g><circle cx="150" cy="83" r="8" fill="${s.color}"/><text x="150" y="198" fill="#eaf7ef" text-anchor="middle" font-size="13">${s.short} / concept map</text></svg>`}
    function start(id){current=id;index=0;answered=false;const s=subjects.find(x=>x.id===id);$('#practiceTitle').textContent=s.title;$('#practiceMeta').textContent=`正式題數：${s.count}｜${s.format}｜目前先以精選題練習，答完可看重點解析`;$('#subjectArt').innerHTML=art(s);renderSubjects();renderQuestion();document.querySelector('#practice').scrollIntoView({behavior:'smooth',block:'start'})}
    function renderQuestion(){if(!current)return;const q=questions[current][index];$('#questionBox').innerHTML=`<div class="qtop"><span>第 ${index+1} / ${questions[current].length} 題</span><span>${answered?'已作答':'未作答'}</span></div><h3>${esc(q[0])}</h3><div class="options">${q[1].map((o,i)=>`<button class="option" data-i="${i}"><b>${String.fromCharCode(65+i)}</b><span>${esc(o)}</span></button>`).join('')}</div><div class="feedback" id="feedback"></div><div class="actions"><button class="btn secondary" id="prev" ${index===0?'disabled':''}>← 上一題</button><button class="btn primary" id="next" disabled>${index===questions[current].length-1?'完成練習':'下一題 →'}</button></div>`;document.querySelectorAll('.option').forEach(b=>b.onclick=()=>answer(+b.dataset.i));$('#prev').onclick=()=>{index--;answered=false;renderQuestion()};$('#next').onclick=()=>{if(index<questions[current].length-1){index++;answered=false;renderQuestion()}else{$('#feedback').textContent='完成！換一門科目繼續保持手感。';$('#feedback').classList.add('show')}}}
    function answer(i){if(answered)return;answered=true;const q=questions[current][index];document.querySelectorAll('.option').forEach((b,n)=>{if(n===q[2])b.classList.add('correct');if(n===i&&i!==q[2])b.classList.add('wrong')});const f=$('#feedback');f.innerHTML=`<strong>${i===q[2]?'答對了！':'再想一下。'}</strong> ${q[3]}`;f.classList.add('show');$('#next').disabled=false}
    document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x===b));renderSubjects()});renderSubjects();
  </script>
</body>
</html>
